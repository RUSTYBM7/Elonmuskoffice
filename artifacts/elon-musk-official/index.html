<!DOCTYPE html>

    <!-- Theme color -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d" />

    <!-- Primary SEO -->
    <title>Elon Musk Official — Entrepreneur, Engineer, Innovator</title>
    <meta name="description" content="The official information hub for Elon Musk — founder of Tesla, SpaceX, Neuralink, xAI, and The Boring Company. Explore his biography, ventures, vision, and latest news." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://elonmuskoffice.site/" />
    <meta property="og:title" content="Elon Musk Official — Entrepreneur, Engineer, Innovator" />

    <meta property="og:image:height" content="630" />

    <meta name="twitter:image:alt" content="Elon Musk Official" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Schema.org Person -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "name": "Elon Musk",
      "alternateName": ["Elon Reeves Musk"],
      "url": "https://elonmuskoffice.site",

      "sameAs": [
        "https://x.com/elonmusk",
        "https://www.forbes.com/profile/elon-musk/",
        "https://en.wikipedia.org/wiki/Elon_Musk"
      ],
      "jobTitle": "CEO & Chief Engineer",
      "worksFor": [
        { "@type": "Organization", "name": "Tesla", "url": "https://www.tesla.com" },
        { "@type": "Organization", "name": "SpaceX", "url": "https://www.spacex.com" },
        { "@type": "Organization", "name": "xAI", "url": "https://x.ai" },
        { "@type": "Organization", "name": "Neuralink", "url": "https://neuralink.com" },
        { "@type": "Organization", "name": "The Boring Company", "url": "https://www.boringcompany.com" },
        { "@type": "Organization", "name": "X Corp.", "url": "https://x.com" }
      ],
      "knowsAbout": ["Electric Vehicles", "Space Exploration", "Artificial Intelligence", "Renewable Energy", "Neural Interfaces", "Rocket Science"],
      "nationality": "American, Canadian, South African",

kind = "web"
previewPath = "/"
title = "Elon Musk Official"
version = "1.0.0"
id = "artifacts/elon-musk-official"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24515

[services.development]
run = "pnpm --filter @workspace/elon-musk-official run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/elon-musk-official", "run", "build" ]
publicDir = "artifacts/elon-musk-official/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24515"
BASE_PATH = "/"
